[project]
name = "otreedeploy"
version = "0.1.0"
description = "Upload-and-run deployment for oTree experiments on a single lab server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mjiangsjtu" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.urls]
Homepage = "https://github.com/mjiangsjtu/otreedeploy"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
otreedeploy = "otreedeploy.__main__:main"
otreedeploy-passwd = "otreedeploy.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["otreedeploy", "templates", "static", "deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises a real uv build and a real oTree boot"]
