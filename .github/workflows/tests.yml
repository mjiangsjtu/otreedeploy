name: tests

on:
  push:
  pull_request:
  schedule:
    # Weekly, so upstream drift (uv, oTree, Ubuntu packages) is caught without a commit.
    - cron: "17 4 * * 1"

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -v

  e2e:
    # A fresh Ubuntu 24.04 with real systemd, PostgreSQL, sudo and bootstrap.sh.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest tests/e2e -v -rxX
        env:
          OTREEDEPLOY_E2E: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-metrics
          path: e2e-metrics.json
          if-no-files-found: ignore
